[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "continuum-3d"
version = "0.1.0"
description = "Zero-storage interactive 3D engineering workspace and generative CAD studio"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Abhijeet Deka" },
]
keywords = ["engineering", "3d", "cad", "physics", "gradio", "trimesh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "gradio>=5.0.0",
    "trimesh>=4.0.0",
    "numpy>=1.26.0",
    "plotly>=5.18.0",
    "groq>=0.11.0",
    "shapely>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/abhijeetdeka83-ctrl/Continuum-3D"
Repository = "https://github.com/abhijeetdeka83-ctrl/Continuum-3D"
Issues = "https://github.com/abhijeetdeka83-ctrl/Continuum-3D/issues"
